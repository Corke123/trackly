spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:trackly}
    password: ${NOTIFICATION_DB_PASSWORD:trackly}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TRACKLY_ISSUER_URI:http://localhost:9000}

server:
  port: ${SERVER_PORT:8082}

trackly:
  activity-stream:
    timeout: ${ACTIVITY_STREAM_TIMEOUT:30m}
    replay-limit: ${ACTIVITY_STREAM_REPLAY_LIMIT:20}
    heartbeat-delay-ms: ${ACTIVITY_STREAM_HEARTBEAT_DELAY_MS:25000}
  servicebus:
    connection-string: ${SERVICEBUS_CONNECTION_STRING:}
    enabled: ${SERVICEBUS_ENABLED:true}
    topic: ${SERVICEBUS_TOPIC:board-events}
    subscription: ${SERVICEBUS_SUBSCRIPTION:notification}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  info:
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never