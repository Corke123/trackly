name: Blue-green deploy
description: >
  Releases one container app as a new revision at 0% traffic, verifies it, then shifts 100% of traffic
  to it, leaving the previous revision warm for rollback (ADR 0007).

inputs:
  app-name:
    description: Container app name, e.g. gateway-staging.
    required: true
  resource-group:
    required: true
  image:
    description: Fully qualified image reference to release.
    required: true
  revision-suffix:
    description: >
      Must be unique per app or `az containerapp update` rejects it, so include the run number rather
      than only the commit. Revision names are capped at 63 characters.
    required: true
  external:
    description: >
      'true' for apps with external ingress, which are the only ones reachable on their per-revision
      FQDN from a runner and so the only ones given an HTTP verification.
    required: false
    default: 'false'
  expected-sha:
    description: Commit that /actuator/info must report as build.revision. External apps only.
    required: true
  health-timeout-seconds:
    description: Allows for activating a scaled-to-zero replica and a JVM cold start.
    required: false
    default: '300'

outputs:
  new-revision:
    description: Revision now serving traffic.
    value: ${{ steps.release.outputs.new-revision }}
  previous-revision:
    description: Revision that was serving before, kept warm for rollback.
    value: ${{ steps.previous.outputs.revision }}
  fqdn:
    description: Public FQDN, for external apps.
    value: ${{ steps.previous.outputs.fqdn }}

runs:
  using: composite
  steps:
    - id: previous
      name: Record what is currently serving
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
      run: |
        set -euo pipefail
        previous=$(az containerapp show -n "$APP" -g "$RG" \
          --query "properties.configuration.ingress.traffic | sort_by(@, &weight) | [-1].revisionName" -o tsv 2>/dev/null || true)
        fqdn=$(az containerapp show -n "$APP" -g "$RG" \
          --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
        echo "revision=${previous}" >> "$GITHUB_OUTPUT"
        echo "fqdn=${fqdn}" >> "$GITHUB_OUTPUT"
        echo "Currently serving: ${previous:-<none>}"

    - id: release
      name: Create the new revision at 0% traffic
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        IMAGE: ${{ inputs.image }}
        SUFFIX: ${{ inputs.revision-suffix }}
      run: |
        set -euo pipefail
        az containerapp update -n "$APP" -g "$RG" \
          --image "$IMAGE" --revision-suffix "$SUFFIX" --output none
        echo "new-revision=${APP}--${SUFFIX}" >> "$GITHUB_OUTPUT"
        echo "Created ${APP}--${SUFFIX} at 0% traffic"

    - name: Wait for the revision to provision
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        REVISION: ${{ steps.release.outputs.new-revision }}
      run: |
        set -euo pipefail
        for _ in $(seq 1 60); do
          state=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REVISION" \
            --query "properties.provisioningState" -o tsv 2>/dev/null || echo Unknown)
          case "$state" in
            Provisioned) echo "Provisioned"; exit 0 ;;
            Failed|Degraded) echo "::error::Revision $REVISION provisioning $state"; exit 1 ;;
            *) echo "  $state"; sleep 10 ;;
          esac
        done
        echo "::error::Revision $REVISION did not provision within 10 minutes"
        exit 1

    - name: Verify the new revision before it takes traffic
      if: inputs.external == 'true'
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        REVISION: ${{ steps.release.outputs.new-revision }}
        EXPECTED_SHA: ${{ inputs.expected-sha }}
        TIMEOUT: ${{ inputs.health-timeout-seconds }}
      run: |
        set -euo pipefail
        domain=$(az containerapp env show \
          --ids "$(az containerapp show -n "$APP" -g "$RG" --query properties.environmentId -o tsv)" \
          --query properties.defaultDomain -o tsv)
        url="https://${REVISION}.${domain}"
        echo "Probing ${url}"

        deadline=$(( $(date +%s) + TIMEOUT ))
        until curl -fsS --max-time 30 "${url}/actuator/health" >/dev/null 2>&1; do
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::error::${REVISION} did not become healthy within ${TIMEOUT}s"
            exit 1
          fi
          sleep 10
        done
        echo "Healthy"

        revision_sha=$(curl -fsS --max-time 30 "${url}/actuator/info" | jq -r '.build.revision // empty')
        if [ "$revision_sha" != "$EXPECTED_SHA" ]; then
          echo "::error::${REVISION} reports build.revision=${revision_sha:-<none>}, expected ${EXPECTED_SHA}"
          exit 1
        fi
        echo "Verified build.revision=${revision_sha}"

    - name: Shift all traffic to the new revision
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        REVISION: ${{ steps.release.outputs.new-revision }}
        PREVIOUS: ${{ steps.previous.outputs.revision }}
      run: |
        set -euo pipefail
        if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$REVISION" ]; then
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "${REVISION}=100" "${PREVIOUS}=0" --output none
        else
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "${REVISION}=100" --output none
        fi
        echo "100% of traffic now on ${REVISION}"

    - name: Summarise the release
      if: always()
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        IMAGE: ${{ inputs.image }}
        REVISION: ${{ steps.release.outputs.new-revision }}
        PREVIOUS: ${{ steps.previous.outputs.revision }}
        FQDN: ${{ steps.previous.outputs.fqdn }}
        OUTCOME: ${{ job.status }}
      run: |
        {
          echo "### ${APP}"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Image | \`${IMAGE}\` |"
          echo "| Previous revision | \`${PREVIOUS:-none}\` |"
          echo "| New revision | \`${REVISION}\` |"
          [ -n "$FQDN" ] && echo "| URL | https://${FQDN} |"
          echo "| Outcome | ${OUTCOME} |"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
