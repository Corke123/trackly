version: 2

updates:
  - package-ecosystem: maven
    directory: /trackly-shared
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels: [ dependencies, trackly-shared ]
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
      azure-sdk:
        patterns: [ "com.azure:*" ]

  - package-ecosystem: maven
    directory: /board-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels: [ dependencies, board-service ]
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
      testcontainers:
        patterns: [ "org.testcontainers:*" ]
      azure-sdk:
        patterns: [ "com.azure:*" ]

  - package-ecosystem: maven
    directory: /notification-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels: [ dependencies, notification-service ]
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
      testcontainers:
        patterns: [ "org.testcontainers:*" ]
      azure-sdk:
        patterns: [ "com.azure:*" ]

  - package-ecosystem: maven
    directory: /identity-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels: [ dependencies, identity-service ]
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
      testcontainers:
        patterns: [ "org.testcontainers:*" ]
      azure-sdk:
        patterns: [ "com.azure:*" ]

  - package-ecosystem: maven
    directory: /gateway-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels: [ dependencies, gateway-service ]
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
      spring-cloud:
        patterns: [ "org.springframework.cloud:*" ]

  - package-ecosystem: npm
    directory: /trackly-client
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels: [ dependencies, trackly-client ]
    groups:
      angular:
        patterns: [ "@angular/*", "@angular-devkit/*" ]
      playwright:
        patterns: [ "@playwright/*", "playwright" ]
      vitest:
        patterns: [ "vitest", "@vitest/*" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [ dependencies, ci ]

  - package-ecosystem: docker
    directory: /board-service
    schedule:
      interval: weekly
      day: monday
    labels: [ dependencies, docker ]

  - package-ecosystem: docker
    directory: /notification-service
    schedule:
      interval: weekly
      day: monday
    labels: [ dependencies, docker ]

  - package-ecosystem: docker
    directory: /identity-service
    schedule:
      interval: weekly
      day: monday
    labels: [ dependencies, docker ]

  - package-ecosystem: docker
    directory: /gateway-service
    schedule:
      interval: weekly
      day: monday
    labels: [ dependencies, docker ]

  - package-ecosystem: pip
    directory: /.github/actions/pipeline-conventions
    schedule:
      interval: weekly
      day: monday
    labels: [ dependencies, ci ]
