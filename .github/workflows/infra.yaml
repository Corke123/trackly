name: Infrastructure

on:
  pull_request:
    branches: [ main ]
    paths: [ 'infra/**', '.github/workflows/infra.yaml' ]
  push:
    branches: [ main ]
    paths: [ 'infra/**', '.github/workflows/infra.yaml' ]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to apply
        type: choice
        options: [ shared, staging, production ]
        required: true

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: Plan ${{ matrix.stack }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [ shared, staging, production ]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.4

      - name: Init
        working-directory: infra/environments/${{ matrix.stack }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"

      - name: Validate
        working-directory: infra/environments/${{ matrix.stack }}
        run: terraform validate

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - id: plan
        name: Plan
        working-directory: infra/environments/${{ matrix.stack }}
        env:
          TF_VAR_client_secret: ${{ matrix.stack == 'production' && secrets.CLIENT_SECRET_PRODUCTION || secrets.CLIENT_SECRET_STAGING }}
          TF_VAR_client_secret_bcrypt: ${{ matrix.stack == 'production' && secrets.CLIENT_SECRET_HASH_PRODUCTION || secrets.CLIENT_SECRET_HASH_STAGING }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var subscription_id="${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            ${{ matrix.stack == 'shared' && format('-var operator_object_id="{0}" -var operator_ip="{1}" -var github_infra_identity_principal_id="{2}" -var budget_alert_email="{3}"', vars.OPERATOR_OBJECT_ID, vars.OPERATOR_IP, vars.INFRA_IDENTITY_PRINCIPAL_ID, vars.BUDGET_ALERT_EMAIL) || format('-var tfstate_resource_group="{0}" -var tfstate_storage_account="{1}"', vars.TFSTATE_RESOURCE_GROUP, vars.TFSTATE_STORAGE_ACCOUNT) }} \
            | tee plan.txt

      - name: Comment the plan on the pull request
        uses: actions/github-script@v9
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/' + process.env.STACK + '/plan.txt', 'utf8');
            const body = '### Terraform plan — `' + process.env.STACK + '`\n\n```terraform\n'
              + (plan.length > 60000 ? '...truncated...\n' + plan.slice(-60000) : plan) + '\n```';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: Apply
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: azure-container-apps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.4

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: stacks
        name: Decide which stacks to apply
        env:
          REQUESTED: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            echo "list=${REQUESTED}" >> "$GITHUB_OUTPUT"
          else
            echo "list=shared staging production" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply
        env:
          STACKS: ${{ steps.stacks.outputs.list }}
          CLIENT_SECRET_STAGING: ${{ secrets.CLIENT_SECRET_STAGING }}
          CLIENT_SECRET_HASH_STAGING: ${{ secrets.CLIENT_SECRET_HASH_STAGING }}
          CLIENT_SECRET_PRODUCTION: ${{ secrets.CLIENT_SECRET_PRODUCTION }}
          CLIENT_SECRET_HASH_PRODUCTION: ${{ secrets.CLIENT_SECRET_HASH_PRODUCTION }}
        run: |
          set -euo pipefail
          for stack in $STACKS; do
            echo "::group::terraform apply ${stack}"
            cd "infra/environments/${stack}"
            terraform init -input=false \
              -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
              -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
              -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
            if [ "$stack" = "shared" ]; then
              terraform apply -input=false -auto-approve -lock-timeout=5m \
                -var subscription_id="${{ vars.AZURE_SUBSCRIPTION_ID }}" \
                -var operator_object_id="${{ vars.OPERATOR_OBJECT_ID }}" \
                -var operator_ip="${{ vars.OPERATOR_IP }}" \
                -var github_infra_identity_principal_id="${{ vars.INFRA_IDENTITY_PRINCIPAL_ID }}" \
                -var budget_alert_email="${{ vars.BUDGET_ALERT_EMAIL }}"
            else
              suffix=$(echo "$stack" | tr '[:lower:]' '[:upper:]')
              secret="CLIENT_SECRET_${suffix}"
              hash="CLIENT_SECRET_HASH_${suffix}"
              export TF_VAR_client_secret="${!secret}"
              export TF_VAR_client_secret_bcrypt="${!hash}"
              terraform apply -input=false -auto-approve -lock-timeout=5m \
                -var subscription_id="${{ vars.AZURE_SUBSCRIPTION_ID }}" \
                -var tfstate_resource_group="${{ vars.TFSTATE_RESOURCE_GROUP }}" \
                -var tfstate_storage_account="${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
              unset TF_VAR_client_secret TF_VAR_client_secret_bcrypt
            fi
            cd - >/dev/null
            echo "::endgroup::"
          done

      - name: Shift traffic to the newest revision
        env:
          STACKS: ${{ steps.stacks.outputs.list }}
        run: |
          set -euo pipefail
          for stack in $STACKS; do
            [ "$stack" = "shared" ] && continue
            rg="rg-trackly-${stack}"
            for service in identity board notification gateway; do
              app="${service}-${stack}"
              latest=$(az containerapp show -n "$app" -g "$rg" --query properties.latestRevisionName -o tsv 2>/dev/null || true)
              [ -z "$latest" ] && continue
              az containerapp ingress traffic set -n "$app" -g "$rg" --revision-weight "${latest}=100" --output none
              echo "${app} -> ${latest}"
            done
          done
