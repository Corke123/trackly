name: Infrastructure

on:
  pull_request:
    branches: [ main ]
    paths: [ 'infra/**.tf', 'infra/**.tfvars', 'infra/**.hcl', '.github/workflows/infra.yaml', '.github/scripts/terraform-stack.sh', '.github/scripts/shift-traffic.sh' ]
  push:
    branches: [ main ]
    paths: [ 'infra/**.tf', 'infra/**.tfvars', 'infra/**.hcl', '.github/workflows/infra.yaml', '.github/scripts/terraform-stack.sh', '.github/scripts/shift-traffic.sh' ]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to apply
        type: choice
        options: [ shared, staging, production ]
        required: true

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}

jobs:
  format:
    name: Check formatting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.4

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

  plan:
    name: Plan ${{ matrix.stack }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [ shared, staging, production ]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.4

      - name: Plan
        env:
          STACK: ${{ matrix.stack }}
          MODE: plan
          OPERATOR_OBJECT_ID: ${{ vars.OPERATOR_OBJECT_ID }}
          OPERATOR_IP: ${{ vars.OPERATOR_IP }}
          INFRA_IDENTITY_PRINCIPAL_ID: ${{ vars.INFRA_IDENTITY_PRINCIPAL_ID }}
          BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
          CLIENT_SECRET_STAGING: ${{ matrix.stack == 'staging' && secrets.CLIENT_SECRET_STAGING || '' }}
          CLIENT_SECRET_HASH_STAGING: ${{ matrix.stack == 'staging' && secrets.CLIENT_SECRET_HASH_STAGING || '' }}
          CLIENT_SECRET_PRODUCTION: ${{ matrix.stack == 'production' && secrets.CLIENT_SECRET_PRODUCTION || '' }}
          CLIENT_SECRET_HASH_PRODUCTION: ${{ matrix.stack == 'production' && secrets.CLIENT_SECRET_HASH_PRODUCTION || '' }}
        run: .github/scripts/terraform-stack.sh

      - name: Comment the plan on the pull request
        uses: actions/github-script@v9
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/' + process.env.STACK + '/plan.txt', 'utf8');
            const body = '### Terraform plan — `' + process.env.STACK + '`\n\n```terraform\n'
              + (plan.length > 60000 ? '...truncated...\n' + plan.slice(-60000) : plan) + '\n```';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: Apply
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: azure-container-apps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.4

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: stacks
        name: Decide which stacks to apply
        env:
          REQUESTED: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            echo "list=${REQUESTED}" >> "$GITHUB_OUTPUT"
          else
            echo "list=shared staging production" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply
        env:
          MODE: apply
          STACKS: ${{ steps.stacks.outputs.list }}
          OPERATOR_OBJECT_ID: ${{ vars.OPERATOR_OBJECT_ID }}
          OPERATOR_IP: ${{ vars.OPERATOR_IP }}
          INFRA_IDENTITY_PRINCIPAL_ID: ${{ vars.INFRA_IDENTITY_PRINCIPAL_ID }}
          BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
          CLIENT_SECRET_STAGING: ${{ secrets.CLIENT_SECRET_STAGING }}
          CLIENT_SECRET_HASH_STAGING: ${{ secrets.CLIENT_SECRET_HASH_STAGING }}
          CLIENT_SECRET_PRODUCTION: ${{ secrets.CLIENT_SECRET_PRODUCTION }}
          CLIENT_SECRET_HASH_PRODUCTION: ${{ secrets.CLIENT_SECRET_HASH_PRODUCTION }}
        run: |
          set -euo pipefail
          for stack in $STACKS; do
            echo "::group::terraform apply ${stack}"
            STACK="$stack" .github/scripts/terraform-stack.sh
            echo "::endgroup::"
          done

      - name: Shift traffic to the newest revision
        env:
          STACKS: ${{ steps.stacks.outputs.list }}
        run: .github/scripts/shift-traffic.sh
