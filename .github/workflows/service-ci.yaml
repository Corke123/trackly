name: Service CI

on:
  workflow_call:
    inputs:
      service:
        description: Directory of the Maven service to build. Also used as its artifact name.
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '25'
      run-integration-tests:
        required: false
        type: boolean
        default: true
      build-image:
        required: false
        type: boolean
        default: true
      spa-artifact:
        description: >
          Artifact holding a built single-page app to ship alongside this service's jar, served
          from `file:/app/static/` (ADR 0006). Empty for a service that ships no front-end.
        required: false
        type: string
        default: ''
      push-image:
        description: >
          Push the image to ACR. True on main only: a pull request builds and scans the image but has
          nothing to deploy it to, and pushing from a PR would let an unmerged commit reach the registry.
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: Maven project version that was built.
        value: ${{ jobs.commit-stage.outputs.version }}
      image-tag:
        description: Immutable tag of the image the package stage produced.
        value: ${{ jobs.package.outputs.image-tag }}

env:
  MAVEN_ARGS: -B -ntp -e

jobs:
  commit-stage:
    name: Commit stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    outputs:
      version: ${{ steps.project.outputs.version }}
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven
        with:
          service: ${{ inputs.service }}
          java-version: ${{ inputs.java-version }}

      - id: project
        name: Resolve project version
        run: |
          set -euo pipefail
          version=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compile, unit-test, gate unit coverage, build the jar
        run: |
          ./mvnw package \
            -Dgit.commit.id=${{ github.sha }} \
            -Dci.build.number=${{ github.run_number }} \
            -Dci.build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summarise unit tests and coverage
        if: always()
        uses: ./.github/actions/maven-report-summary
        with:
          service: ${{ inputs.service }}
          stage: Commit stage — unit tests
          test-reports: target/surefire-reports
          jacoco-csv: target/site/jacoco/jacoco.csv

      - name: Annotate failing tests on the pull request
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: ${{ inputs.service }}/target/surefire-reports/TEST-*.xml
          check_name: ${{ inputs.service }} unit tests
          include_passed: false
          fail_on_failure: false
          job_summary: false

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-unit-reports
          path: |
            ${{ inputs.service }}/target/surefire-reports/
            ${{ inputs.service }}/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload the application jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-jar
          path: ${{ inputs.service }}/target/*.jar
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  integration-stage:
    name: Integration stage
    needs: commit-stage
    if: inputs.run-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      TESTCONTAINERS_CHECKS_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven
        with:
          service: ${{ inputs.service }}
          java-version: ${{ inputs.java-version }}

      - name: Pre-pull Testcontainers images in parallel
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          list=.ci/testcontainers-images.txt
          if [ ! -f "$list" ]; then
            echo "No $list for ${SERVICE}; letting Testcontainers pull lazily."
            exit 0
          fi
          start=$SECONDS
          while read -r image || [ -n "$image" ]; do
            case "$image" in ''|\#*) continue ;; esac
            ( echo "pulling $image"; docker pull -q "$image" ) &
          done < "$list"
          wait
          echo "Pre-pulled Testcontainers images in $((SECONDS - start))s." >> "$GITHUB_STEP_SUMMARY"

      - name: Run integration tests and gate merged coverage
        run: |
          ./mvnw verify \
            -Dgit.commit.id=${{ github.sha }} \
            -Dci.build.number=${{ github.run_number }} \
            -Dci.build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summarise integration tests and merged coverage
        if: always()
        uses: ./.github/actions/maven-report-summary
        with:
          service: ${{ inputs.service }}
          stage: Integration stage — integration tests
          test-reports: target/failsafe-reports
          jacoco-csv: target/site/jacoco-merged/jacoco.csv

      - name: Annotate failing tests on the pull request
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: ${{ inputs.service }}/target/failsafe-reports/TEST-*.xml
          check_name: ${{ inputs.service }} integration tests
          include_passed: false
          fail_on_failure: false
          job_summary: false

      - name: Upload integration reports and merged coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-integration-reports
          path: |
            ${{ inputs.service }}/target/failsafe-reports/
            ${{ inputs.service }}/target/site/jacoco-it/
            ${{ inputs.service }}/target/site/jacoco-merged/
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Package
    needs: commit-stage
    if: inputs.build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      security-events: write
      attestations: write
    outputs:
      image-tag: ${{ steps.image.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the jar the commit stage built and gated
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.service }}-jar
          path: ${{ inputs.service }}/target

      - name: Download the single-page app
        if: inputs.spa-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.spa-artifact }}
          path: ${{ inputs.service }}/static

      - name: Sign in to Azure
        if: inputs.push-image
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the container registry
        if: inputs.push-image
        run: az acr login --name ${{ vars.ACR_NAME }}

      - id: image
        name: Build and scan the container image
        uses: ./.github/actions/docker-build
        with:
          service: ${{ inputs.service }}
          image-name: trackly/${{ inputs.service }}
          version: ${{ needs.commit-stage.outputs.version }}
          git-sha: ${{ github.sha }}
          registry: ${{ inputs.push-image && vars.ACR_LOGIN_SERVER || '' }}
          push: ${{ inputs.push-image && 'true' || 'false' }}

      - name: Summarise the package stage
        env:
          IMAGE: ${{ steps.image.outputs.image-tag }}
        run: |
          set -euo pipefail
          {
            echo "## Package stage"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Version | \`${{ needs.commit-stage.outputs.version }}\` |"
            echo "| Built from | \`${GITHUB_SHA}\` |"
            echo "| Pushed | ${{ inputs.push-image && 'yes' || 'no (build and scan only)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
