name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [ staging, production ]
        required: true
      service:
        description: Service to roll back
        type: choice
        options: [ all, gateway, identity, board, notification ]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: azure-container-apps
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.service }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Re-point traffic to the previous revision
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: .github/scripts/rollback.sh
