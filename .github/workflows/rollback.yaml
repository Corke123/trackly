name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [ staging, production ]
        required: true
      service:
        description: Service to roll back
        type: choice
        options: [ all, gateway, identity, board, notification ]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: azure-container-apps
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.service }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Re-point traffic to the previous revision
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail

          if [ "$SERVICE" = "all" ]; then
            services="gateway identity board notification"
          else
            services="$SERVICE"
          fi

          {
            echo "## Rollback — ${ENVIRONMENT}"
            echo
            echo "| App | From | To |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for service in $services; do
            app="${service}-${ENVIRONMENT}"

            current=$(az containerapp show -n "$app" -g "$RG" \
              --query "properties.configuration.ingress.traffic | sort_by(@, &weight) | [-1].revisionName" -o tsv)

            target=$(az containerapp revision list -n "$app" -g "$RG" \
              --query "sort_by([?properties.active], &properties.createdTime) | reverse(@) | [?name!='${current}'] | [0].name" -o tsv)

            if [ -z "$target" ] || [ "$target" = "null" ]; then
              echo "::error::No previous active revision for ${app} to roll back to"
              echo "| $app | \`$current\` | none available |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            az containerapp ingress traffic set -n "$app" -g "$RG" \
              --revision-weight "${target}=100" "${current}=0" --output none

            echo "${app}: ${current} -> ${target}"
            echo "| $app | \`$current\` | \`$target\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo "Schema migrations are **not** rolled back; only traffic moved."
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"
