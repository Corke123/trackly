name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: >
          Target environment. Also the suffix of every container app name, so staging deploys
          identity-staging and production deploys identity-production.
        required: true
        type: string
      services:
        description: JSON array of services to deploy, from the change detection job.
        required: true
        type: string
    outputs:
      gateway-url:
        description: FQDN of the gateway ingress, for tests that run against this environment.
        value: ${{ jobs.deploy.outputs.gateway-url }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: azure-container-apps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway-url: ${{ steps.gateway-url.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: names
        name: Derive the revision suffix
        run: |
          set -euo pipefail
          echo "suffix=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - id: gateway-url
        name: Resolve the gateway's public FQDN
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          APP: gateway-${{ inputs.environment }}
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=${fqdn}" >> "$GITHUB_OUTPUT"

      - name: Release every changed service
        env:
          SERVICES: ${{ inputs.services }}
          ENVIRONMENT: ${{ inputs.environment }}
          RG: ${{ vars.RESOURCE_GROUP }}
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          SUFFIX: ${{ steps.names.outputs.suffix }}
          EXPECTED_SHA: ${{ github.sha }}
        run: .github/scripts/blue-green-deploy.sh

      - name: Report live traffic
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: .github/scripts/report-traffic.sh
