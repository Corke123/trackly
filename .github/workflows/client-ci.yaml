name: Client CI

# The SPA is staged the same way the services are (ADR 0010): a fast commit stage that comes back in
# about a minute, with the slower browser-driven journeys behind it. The production bundle is built
# once by ci.yaml's build-spa job and shipped as a layer of the gateway image (ADR 0006), so there is
# neither a bundle step nor a package stage here.

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24'
      working-directory:
        required: false
        type: string
        default: trackly-client
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token. Absent on Dependabot and fork pull requests, which skip the scan.
        required: false

jobs:
  commit-stage:
    name: Commit stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Unit-test the client and gate coverage
        run: npm run test:ci

      - name: Annotate failing tests on the pull request
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: ${{ inputs.working-directory }}/reports/unit.xml
          check_name: trackly-client unit tests
          include_passed: false
          fail_on_failure: false
          job_summary: false

      - name: Upload unit test reports and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trackly-client-unit-reports
          path: |
            ${{ inputs.working-directory }}/reports/
            ${{ inputs.working-directory }}/coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Analyse the client and gate its pull request
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

      - name: Report the skipped analysis
        if: env.SONAR_TOKEN == ''
        run: |
          set -euo pipefail
          echo "### trackly-client — SonarQube Cloud analysis skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No \`SONAR_TOKEN\` was available to this run, so the quality gate did not run." >> "$GITHUB_STEP_SUMMARY"

  e2e-stage:
    name: End-to-end stage
    needs: commit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end journeys
        run: npm run e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trackly-client-e2e-report
          path: |
            ${{ inputs.working-directory }}/playwright-report/
            ${{ inputs.working-directory }}/test-results/
          retention-days: 7
          if-no-files-found: warn
