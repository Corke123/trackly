name: Client CI

# The SPA is staged the same way the services are (ADR 0010): a fast commit stage that comes back in
# about a minute, with the slower browser-driven journeys behind it. The image that ships the SPA is
# built by gateway-service's own pipeline (ADR 0006), so there is no package stage here.

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24'
      working-directory:
        required: false
        type: string
        default: trackly-client

jobs:
  commit-stage:
    name: Commit stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit-test the client and gate coverage
        run: npm run test:ci

      - name: Build the production bundle
        run: npm run build

      - name: Annotate failing tests on the pull request
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: ${{ inputs.working-directory }}/reports/unit.xml
          check_name: trackly-client unit tests
          include_passed: false
          fail_on_failure: false
          job_summary: false

      - name: Upload unit test reports and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trackly-client-unit-reports
          path: |
            ${{ inputs.working-directory }}/reports/
            ${{ inputs.working-directory }}/coverage/
          retention-days: 7
          if-no-files-found: warn

  e2e-stage:
    name: End-to-end stage
    needs: commit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end journeys
        run: npm run e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trackly-client-e2e-report
          path: |
            ${{ inputs.working-directory }}/playwright-report/
            ${{ inputs.working-directory }}/test-results/
          retention-days: 7
          if-no-files-found: warn
