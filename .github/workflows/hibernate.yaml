name: Hibernate

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the database server
        type: choice
        options: [ stop, start ]
        required: true

permissions:
  contents: read

concurrency:
  group: hibernate
  cancel-in-progress: false

jobs:
  hibernate:
    name: ${{ inputs.action || 'stop' }} PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stop or start the server
        env:
          ACTION: ${{ inputs.action || 'stop' }}
        run: .github/scripts/hibernate.sh
