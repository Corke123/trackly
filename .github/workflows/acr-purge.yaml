name: Purge old images

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      keep-days:
        description: Keep sha- tags newer than this many days
        type: string
        default: '30'

permissions:
  contents: read

concurrency:
  group: acr-purge
  cancel-in-progress: false

jobs:
  purge:
    name: Purge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete untagged manifests and stale commit tags
        env:
          KEEP_DAYS: ${{ inputs.keep-days || '30' }}
          ACR: ${{ vars.ACR_NAME }}
        run: .github/scripts/acr-purge.sh
