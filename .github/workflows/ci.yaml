name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force-all:
        description: Build every service regardless of which paths changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.select.outputs.services }}
      client: ${{ steps.select.outputs.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            board-service:
              - 'board-service/**'
            notification-service:
              - 'notification-service/**'
            identity-service:
              - 'identity-service/**'
            gateway-service:
              - 'gateway-service/**'
              - 'trackly-client/**'
            trackly-client:
              - 'trackly-client/**'
            shared:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'docker-compose.yaml'

      - id: select
        name: Build the service matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          SHARED: ${{ steps.filter.outputs.shared }}
          CLIENT: ${{ steps.filter.outputs.trackly-client }}
          FORCE_ALL: ${{ inputs.force-all }}
        run: |
          set -euo pipefail
          ALL='["board-service","notification-service","identity-service","gateway-service"]'
          if [ "$SHARED" = "true" ] || [ "$FORCE_ALL" = "true" ]; then
            SERVICES="$ALL"
            CLIENT_BUILD=true
            REASON="shared paths changed"
          else
            SERVICES=$(printf '%s' "$CHANGED" | jq -c 'map(select(. != "shared" and . != "trackly-client"))')
            CLIENT_BUILD="$CLIENT"
            REASON="path filter"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "client=$CLIENT_BUILD" >> "$GITHUB_OUTPUT"
          {
            echo "## Change detection"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Reason | $REASON |"
            echo "| Services to build | \`$SERVICES\` |"
            echo "| Build the client | \`$CLIENT_BUILD\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12

      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          config: .github/zizmor.yml
          min-severity: high
          advanced-security: false
          annotations: true

  build:
    name: ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: ${{ matrix.service }}
      java-version: '25'
      docker-context: ${{ matrix.service == 'gateway-service' && '.' || '' }}
      push-image: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      checks: write
      id-token: write

  client:
    name: trackly-client
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    uses: ./.github/workflows/client-ci.yaml
    with:
      node-version: '24'
    permissions:
      contents: read
      checks: write

  ci:
    name: CI required
    if: always()
    needs: [ detect-changes, lint, build, client ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'to_entries
            | all(.value.result == "success" or .value.result == "skipped")' > /dev/null

  wake-database:
    name: Wake the database
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start the server if hibernate.yaml stopped it
        run: |
          set -euo pipefail
          server=$(az postgres flexible-server list -g rg-trackly-shared --query "[0].name" -o tsv)
          state=$(az postgres flexible-server show -n "$server" -g rg-trackly-shared --query state -o tsv)
          echo "$server is $state"
          if [ "$state" != "Ready" ]; then
            az postgres flexible-server start -n "$server" -g rg-trackly-shared --output none
            echo "Started $server"
          fi

  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]'
    needs: [ detect-changes, ci, wake-database ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: azure-container-apps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway-url: ${{ steps.gateway.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: names
        name: Derive the revision suffix
        run: |
          set -euo pipefail
          echo "suffix=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: identity-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'identity-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: identity-staging
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/identity-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          external: 'true'
          expected-sha: ${{ github.sha }}

      - name: board-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'board-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: board-staging
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/board-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          expected-sha: ${{ github.sha }}

      - name: notification-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'notification-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: notification-staging
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/notification-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          expected-sha: ${{ github.sha }}

      - id: gateway
        name: gateway-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'gateway-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: gateway-staging
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/gateway-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          external: 'true'
          expected-sha: ${{ github.sha }}

      - name: Report live traffic
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Live traffic — staging"
            echo
            echo "| App | Revision | Weight |"
            echo "|---|---|---|"
            for app in identity-staging board-staging notification-staging gateway-staging; do
              az containerapp show -n "$app" -g "${{ vars.RESOURCE_GROUP }}" \
                --query "properties.configuration.ingress.traffic[].{r:revisionName,w:weight}" -o tsv 2>/dev/null |
                while IFS=$'\t' read -r rev weight; do
                  echo "| $app | \`${rev:-latest}\` | ${weight}% |"
                done
            done
          } >> "$GITHUB_STEP_SUMMARY"

  acceptance-staging:
    name: Acceptance tests (staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trackly-client/package-lock.json

      - working-directory: trackly-client
        run: npm ci --ignore-scripts

      - working-directory: trackly-client
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the full-stack journeys against staging
        working-directory: trackly-client
        env:
          TRACKLY_URL: https://${{ needs.deploy-staging.outputs.gateway-url }}
        run: npm run e2e:stack

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-staging-report
          path: |
            trackly-client/playwright-report/
            trackly-client/test-results/
          retention-days: 7

  deploy-production:
    name: Deploy production
    needs: [ detect-changes, acceptance-staging ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: azure-container-apps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: names
        run: echo "suffix=${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: identity-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'identity-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: identity-production
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/identity-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          external: 'true'
          expected-sha: ${{ github.sha }}

      - name: board-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'board-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: board-production
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/board-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          expected-sha: ${{ github.sha }}

      - name: notification-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'notification-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: notification-production
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/notification-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          expected-sha: ${{ github.sha }}

      - name: gateway-service
        if: contains(fromJSON(needs.detect-changes.outputs.services), 'gateway-service')
        uses: ./.github/actions/blue-green-deploy
        with:
          app-name: gateway-production
          resource-group: ${{ vars.RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/trackly/gateway-service:sha-${{ github.sha }}
          revision-suffix: ${{ steps.names.outputs.suffix }}
          external: 'true'
          expected-sha: ${{ github.sha }}

      - name: Report live traffic
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Live traffic — production"
            echo
            echo "| App | Revision | Weight |"
            echo "|---|---|---|"
            for app in identity-production board-production notification-production gateway-production; do
              az containerapp show -n "$app" -g "${{ vars.RESOURCE_GROUP }}" \
                --query "properties.configuration.ingress.traffic[].{r:revisionName,w:weight}" -o tsv 2>/dev/null |
                while IFS=$'\t' read -r rev weight; do
                  echo "| $app | \`${rev:-latest}\` | ${weight}% |"
                done
            done
            echo
            echo "Roll back with the **Rollback** workflow; the previous revision is still warm."
          } >> "$GITHUB_STEP_SUMMARY"

  notify-broken-mainline:
    name: Report broken mainline
    if: failure() && github.ref == 'refs/heads/main'
    needs: [ build, client ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the broken-build issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          BODY=$(cat <<EOF
          CI failed on \`main\` at \`${GITHUB_SHA}\` (@${GITHUB_ACTOR}).

          Run: ${RUN_URL}

          Fixing a broken mainline takes priority over new work: revert the offending commit,
          or fix forward if the fix is obvious and small.
          EOF
          )
          EXISTING=$(gh issue list --label broken-build --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Broken mainline: CI failed at ${SHORT}" \
              --label broken-build --body "$BODY"
          fi
