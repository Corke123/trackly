name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force-all:
        description: Build every service regardless of which paths changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.select.outputs.services }}
      backend-services: ${{ steps.select.outputs.backend-services }}
      gateway: ${{ steps.select.outputs.gateway }}
      client: ${{ steps.select.outputs.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            board-service:
              - 'board-service/**'
            notification-service:
              - 'notification-service/**'
            identity-service:
              - 'identity-service/**'
            gateway-service:
              - 'gateway-service/**'
              - 'trackly-client/**'
            trackly-client:
              - 'trackly-client/**'
            shared:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - 'docker-compose.yaml'

      - id: select
        name: Build the service matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          SHARED: ${{ steps.filter.outputs.shared }}
          CLIENT: ${{ steps.filter.outputs.trackly-client }}
          FORCE_ALL: ${{ inputs.force-all }}
        run: .github/scripts/select-services.sh

  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12

      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          config: .github/zizmor.yml
          min-severity: high
          advanced-security: false
          annotations: true

      - name: Parse every shell script
        run: |
          set -euo pipefail
          # actionlint and zizmor read workflow YAML and the shell inside `run:` blocks, not the external
          # scripts those blocks call. A syntax error in one of these is invisible until the job runs it,
          # and a deploy script that dies on a stray quote dies after the release has already started.
          shopt -s nullglob
          for script in .github/scripts/*.sh infra/*.sh; do
            bash -n "$script" || { echo "::error file=$script::not valid bash"; exit 1; }
            echo "  ok  $script"
          done

      - name: Assert every service is wired into the pipeline
        uses: ./.github/actions/pipeline-conventions
        with:
          min-coverage: '0.85'

  sonar-repository:
    name: Analyse infrastructure and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyse the repository and gate its pull request
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

      - name: Report the skipped analysis
        if: env.SONAR_TOKEN == ''
        run: |
          set -euo pipefail
          echo "### Repository — SonarQube Cloud analysis skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No \`SONAR_TOKEN\` was available to this run, so the quality gate did not run." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.backend-services) }}
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: ${{ matrix.service }}
      java-version: '25'
      push-image: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      checks: write
      id-token: write
      security-events: write
      attestations: write
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-spa:
    name: trackly-client / Bundle
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trackly-client/package-lock.json

      - name: Build the production bundle
        working-directory: trackly-client
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: trackly-client-dist
          path: trackly-client/dist/trackly-client/browser/
          retention-days: 7
          if-no-files-found: error

  build-gateway:
    name: gateway-service
    needs: [ detect-changes, build-spa ]
    if: needs.detect-changes.outputs.gateway == 'true'
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: gateway-service
      java-version: '25'
      spa-artifact: trackly-client-dist
      push-image: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      checks: write
      id-token: write
      security-events: write
      attestations: write
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  client:
    name: trackly-client
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    uses: ./.github/workflows/client-ci.yaml
    with:
      node-version: '24'
    permissions:
      contents: read
      checks: write
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci:
    name: CI required
    if: always()
    needs: [ detect-changes, lint, sonar-repository, build, build-spa, build-gateway, client ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'to_entries
            | all(.value.result == "success" or .value.result == "skipped")' > /dev/null

  wake-database:
    name: Wake the database
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start the server if hibernate.yaml stopped it
        env:
          ACTION: start
        run: .github/scripts/hibernate.sh

  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]'
    needs: [ detect-changes, ci, wake-database ]
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: staging
      services: ${{ needs.detect-changes.outputs.services }}
    permissions:
      contents: read
      id-token: write

  acceptance-staging:
    name: Acceptance tests (staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trackly-client/package-lock.json

      - working-directory: trackly-client
        run: npm ci --ignore-scripts

      - working-directory: trackly-client
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the full-stack journeys against staging
        working-directory: trackly-client
        env:
          TRACKLY_URL: https://${{ needs.deploy-staging.outputs.gateway-url }}
        run: npm run e2e:stack

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-staging-report
          path: |
            trackly-client/playwright-report/
            trackly-client/test-results/
          retention-days: 7

  deploy-production:
    name: Deploy production
    needs: [ detect-changes, acceptance-staging ]
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: production
      services: ${{ needs.detect-changes.outputs.services }}
    permissions:
      contents: read
      id-token: write

  notify-broken-mainline:
    name: Report broken mainline
    if: failure() && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open or update the broken-build issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-broken-mainline.sh

  notify-failed-release:
    name: Report failed release
    if: failure() && github.ref == 'refs/heads/main'
    needs: [ wake-database, deploy-staging, acceptance-staging ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open or update the deployment issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WAKE: ${{ needs.wake-database.result }}
          STAGING: ${{ needs.deploy-staging.result }}
          ACCEPTANCE: ${{ needs.acceptance-staging.result }}
        run: .github/scripts/notify-failed-release.sh
