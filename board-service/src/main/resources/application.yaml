spring:
  application:
    name: board-service
  datasource:
    url: ${BOARD_DB_URL:jdbc:postgresql://localhost:5432/board_db}
    username: ${BOARD_DB_USERNAME:trackly}
    password: ${BOARD_DB_PASSWORD:trackly}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TRACKLY_ISSUER_URI:http://localhost:9000}

server:
  port: ${SERVER_PORT:8081}

trackly:
  servicebus:
    namespace: ${SERVICEBUS_NAMESPACE:}
    connection-string: ${SERVICEBUS_CONNECTION_STRING:}
    topic: ${SERVICEBUS_TOPIC:board-events}
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  info:
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never