name: trackly

# Infrastructure only. The services run on the host against these — see the README. Their images are
# built by CI from the jar the commit stage gated (ADR 0010), not from this file.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trackly
      POSTGRES_PASSWORD: trackly
      POSTGRES_DB: trackly
    ports:
      - "5432:5432"
    volumes:
      - ./local/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trackly" ]
      interval: 5s
      timeout: 3s
      retries: 10

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sqledge
    ports:
      - "5672:5672"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"
      ACCEPT_EULA: "Y"
    volumes:
      - ./local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  servicebus-ready:
    image: alpine:3.22
    depends_on:
      servicebus-emulator:
        condition: service_started
    command:
      - sh
      - -c
      - 'for i in $$(seq 1 90); do nc -z servicebus-emulator 5672 && echo "Service Bus emulator is ready" && exit 0; sleep 2; done; echo "Service Bus emulator did not become ready" >&2; exit 1'
