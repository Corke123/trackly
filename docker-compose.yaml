name: trackly

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trackly
      POSTGRES_PASSWORD: trackly
      POSTGRES_DB: trackly
    ports:
      - "5432:5432"
    volumes:
      - ./local/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trackly" ]
      interval: 5s
      timeout: 3s
      retries: 10

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sqledge
    ports:
      - "5672:5672"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"
      ACCEPT_EULA: "Y"
    volumes:
      - ./local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  servicebus-ready:
    image: alpine:3.22
    depends_on:
      servicebus-emulator:
        condition: service_started
    command:
      - sh
      - -c
      - 'for i in $$(seq 1 90); do nc -z servicebus-emulator 5672 && echo "Service Bus emulator is ready" && exit 0; sleep 2; done; echo "Service Bus emulator did not become ready" >&2; exit 1'

  identity-service:
    build: ./identity-service
    image: trackly/identity-service:${TRACKLY_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      IDENTITY_DB_USERNAME: trackly
      IDENTITY_DB_PASSWORD: trackly
      TRACKLY_ISSUER_URI: http://host.docker.internal:9000
      TRACKLY_CLIENT_SECRET: "{noop}trackly-secret"
      TRACKLY_REDIRECT_URI: http://localhost:8080/login/oauth2/code/trackly
      TRACKLY_POST_LOGOUT_REDIRECT_URI: http://localhost:8080
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  board-service:
    build: ./board-service
    image: trackly/board-service:${TRACKLY_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-ready:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOARD_DB_URL: jdbc:postgresql://postgres:5432/board_db
      BOARD_DB_USERNAME: trackly
      BOARD_DB_PASSWORD: trackly
      TRACKLY_ISSUER_URI: http://host.docker.internal:9000
      SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      SERVICEBUS_TOPIC: board-events
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  notification-service:
    build: ./notification-service
    image: trackly/notification-service:${TRACKLY_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-ready:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: trackly
      NOTIFICATION_DB_PASSWORD: trackly
      TRACKLY_ISSUER_URI: http://host.docker.internal:9000
      SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      SERVICEBUS_TOPIC: board-events
      SERVICEBUS_SUBSCRIPTION: notification
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: trackly/gateway-service:${TRACKLY_TAG:-local}
    depends_on:
      identity-service:
        condition: service_healthy
      board-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRACKLY_ISSUER_URI: http://host.docker.internal:9000
      TRACKLY_CLIENT_ID: trackly
      TRACKLY_CLIENT_SECRET: trackly-secret
      BOARD_SERVICE_URI: http://board-service:8081
      NOTIFICATION_SERVICE_URI: http://notification-service:8082
      IDENTITY_SERVICE_URI: http://identity-service:9000
      TRACKLY_SERVE_SPA: "${TRACKLY_SERVE_SPA:-true}"
      FRONTEND_URI: http://host.docker.internal:4200
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
